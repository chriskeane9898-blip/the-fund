<title>The Fund</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#070c0a;
    --bg-2:#0a1310;
    --surface:#0e1713;
    --surface-2:#121e18;
    --surface-3:#16241d;
    --border:rgba(94,234,168,0.20);
    --border-strong:rgba(94,234,168,0.45);
    --text:#e9f3ec;
    --text-dim:#8fa89b;
    --text-faint:#516358;
    --accent:#4fe6a0;
    --accent-strong:#b6ffdc;
    --accent-wash:rgba(79,230,160,0.10);
    --gold:#e8b34d;
    --gold-dim:#a9832f;
    --gold-wash:rgba(232,179,77,0.10);
    --alert:#ff6b4a;
    --alert-wash:rgba(255,107,74,0.12);
    --radius:2px;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    --disp:'Archivo Black', 'Archivo', ui-sans-serif, system-ui, sans-serif;
    --head:'Archivo', ui-sans-serif, system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    background:
      linear-gradient(var(--bg-2), var(--bg-2)) fixed,
      repeating-linear-gradient(0deg, rgba(94,234,168,0.035) 0px, rgba(94,234,168,0.035) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(94,234,168,0.035) 0px, rgba(94,234,168,0.035) 1px, transparent 1px, transparent 40px),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:#04120b;}

  a{color:var(--accent);}

  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ---------- ticker ---------- */
  .ticker{
    background:#040a07;
    border-bottom:1px solid var(--border);
    overflow:hidden;
    white-space:nowrap;
    position:relative;
  }
  .ticker::before, .ticker::after{
    content:"";
    position:absolute; top:0; bottom:0; width:36px; z-index:2;
    pointer-events:none;
  }
  .ticker::before{left:0;background:linear-gradient(90deg,#040a07,transparent);}
  .ticker::after{right:0;background:linear-gradient(270deg,#040a07,transparent);}
  .ticker-track{
    display:inline-flex;
    align-items:center;
    gap:0;
    animation:scroll-left 38s linear infinite;
    padding:9px 0;
  }
  .ticker:hover .ticker-track{animation-play-state:paused;}
  @keyframes scroll-left{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  .ticker-item{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--text-dim);
    padding:0 22px;
    border-right:1px solid var(--border);
    white-space:nowrap;
  }
  .ticker-item b{color:var(--accent);font-weight:600;}
  .ticker-item .g{color:var(--gold);font-weight:600;}
  .ticker-item .a{color:var(--alert);font-weight:600;}
  @media (prefers-reduced-motion: reduce){
    .ticker-track{animation:none;}
  }

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  @media (max-width:480px){
    .wrap{padding:0 14px 56px;}
    .hero{padding:26px 0 18px;gap:14px;}
    .badge{width:72px;height:72px;}
    .panel-body{padding:14px;}
    .idbar{padding:12px;gap:8px;}
  }

  .hero{
    display:flex;
    align-items:center;
    gap:24px;
    padding:44px 0 28px;
    flex-wrap:wrap;
  }
  .badge{
    position:relative;
    width:96px;height:96px;
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, var(--accent-wash), transparent 70%), var(--surface);
    border:1px solid var(--border-strong);
  }
  .badge-inner{
    position:relative;
    width:78%;height:78%;
    display:flex;align-items:center;justify-content:center;
  }
  .badge-inner svg{width:100%;height:100%;display:block;overflow:visible;}
  .badge-inner svg image{filter:drop-shadow(0 0 10px rgba(79,230,160,0.35));}
  .centaur-trace{
    fill:none;
    stroke:#eafff2;
    stroke-width:9;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:14 86;
    filter:drop-shadow(0 0 4px rgba(182,255,220,0.95)) drop-shadow(0 0 9px rgba(79,230,160,0.7));
    opacity:0;
    animation:centaur-trace 9s ease-in-out infinite;
  }
  @keyframes centaur-trace{
    0%{ stroke-dashoffset:0; opacity:0; }
    4%{ opacity:1; }
    62%{ stroke-dashoffset:-100; opacity:1; }
    70%{ opacity:0; }
    100%{ stroke-dashoffset:-100; opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .centaur-trace{ animation:none; opacity:0; }
  }
  .corner{position:absolute;width:10px;height:10px;}
  .corner.tl{top:-1px;left:-1px;border-top:2px solid var(--gold);border-left:2px solid var(--gold);}
  .corner.tr{top:-1px;right:-1px;border-top:2px solid var(--gold);border-right:2px solid var(--gold);}
  .corner.bl{bottom:-1px;left:-1px;border-bottom:2px solid var(--gold);border-left:2px solid var(--gold);}
  .corner.br{bottom:-1px;right:-1px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold);}

  .hero-text{flex:1 1 280px;min-width:220px;}
  .hero-text h1{
    font-family:var(--disp);
    font-size:clamp(30px,5vw,46px);
    letter-spacing:0.01em;
    margin:0;
    line-height:1;
    text-transform:uppercase;
    color:var(--text);
  }
  .hero-text .tagline{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:8px;
  }
  .hero-status{
    margin-left:auto;
    text-align:right;
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.05em;
  }
  .hero-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;box-shadow:0 0 6px var(--accent);}

  /* identity bar */
  .idbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    margin-bottom:28px;
  }
  .idbar-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);margin-right:4px;}
  .pill{
    font-family:var(--mono);font-size:12.5px;
    padding:6px 12px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s, color .15s, background .15s;
  }
  .pill:hover{border-color:var(--border-strong);color:var(--text);}
  .pill.active{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-strong);}
  .pill .swatch{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .idbar-current{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
  .idbar-current b{color:var(--text);}

  /* stat tiles */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    margin-bottom:28px;
  }
  .stat{
    background:var(--surface);
    padding:20px 18px;
    position:relative;
  }
  .stat-label{font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);}
  .stat-value{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent-strong);margin-top:8px;letter-spacing:-0.01em;}
  .stat-value.gold{color:var(--gold);}
  .stat-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:4px;}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}

  /* panel */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;align-items:start;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    position:relative;
    min-width:0;
  }
  .panel > .corner.tl,.panel > .corner.tr,.panel > .corner.bl,.panel > .corner.br{width:14px;height:14px;}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--surface-2), var(--surface));
  }
  .panel-head h2{
    font-family:var(--head);
    font-weight:800;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
    display:flex;align-items:center;gap:8px;
  }
  .panel-head h2::before{content:"//";color:var(--accent);font-family:var(--mono);}
  .panel-flag{font-family:var(--mono);font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);color:var(--text-dim);}
  .panel-flag.live{color:var(--accent);border-color:var(--border-strong);}
  .panel-flag.locked{color:var(--gold);border-color:var(--gold-dim);}
  .panel-body{padding:18px;}

  .field-row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .field-row label{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);}
  input[type="text"],input[type="number"],textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:13.5px;
    padding:8px 10px;
    width:100%;
    border-radius:var(--radius);
  }
  input.num-in{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  textarea{resize:vertical;min-height:56px;font-family:var(--sans);}

  .btn{
    font-family:var(--mono);
    font-size:12px;letter-spacing:0.06em;text-transform:uppercase;
    background:var(--accent-wash);
    border:1px solid var(--border-strong);
    color:var(--accent-strong);
    padding:8px 14px;
    cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:rgba(79,230,160,0.2);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.gold{background:var(--gold-wash);border-color:var(--gold-dim);color:var(--gold);}
  .btn.gold:hover{background:rgba(232,179,77,0.22);}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);border-color:var(--border-strong);}
  .btn.small{padding:5px 10px;font-size:11px;}
  .btn.full{width:100%;}

  .divider{height:1px;background:var(--border);margin:16px 0;}

  /* meeting readout */
  .readout{
    font-family:var(--mono);
    padding:14px 16px;
    background:var(--surface-2);
    border:1px solid var(--border);
    margin-bottom:14px;
  }
  .readout .rk{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);}
  .readout .rv{font-size:17px;color:var(--text);margin-top:4px;}
  .readout .rv.locked{color:var(--gold);}
  .readout .rn{font-size:12px;color:var(--text-dim);margin-top:6px;font-family:var(--sans);}

  .vote-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .vote-row:last-child{border-bottom:none;}
  .vote-main{flex:1;min-width:0;}
  .vote-label{font-size:13.5px;color:var(--text);font-weight:500;}
  .vote-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  .vote-bar-track{height:5px;background:var(--surface-2);border:1px solid var(--border);margin-top:7px;overflow:hidden;}
  .vote-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-strong));box-shadow:0 0 8px rgba(79,230,160,0.5);}
  .vote-bar-fill.lead{background:linear-gradient(90deg,var(--alert),#ffb199);box-shadow:0 0 8px rgba(255,107,74,0.5);}
  .vote-count{font-family:var(--mono);font-size:18px;color:var(--accent-strong);min-width:28px;text-align:right;}
  .vote-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}

  .empty{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-faint);
    padding:18px 4px;
    text-align:center;
    border:1px dashed var(--border);
  }

  /* ledger table */
  .ledger-wrap{overflow-x:auto;}
  table.ledger{border-collapse:collapse;width:100%;min-width:560px;}
  table.ledger th,table.ledger td{
    font-family:var(--mono);font-size:12px;
    padding:7px 8px;
    border-bottom:1px solid var(--border);
    text-align:right;
    white-space:nowrap;
  }
  table.ledger th{
    text-align:right;
    color:var(--text-faint);
    letter-spacing:0.06em;text-transform:uppercase;font-size:10px;
    border-bottom:1px solid var(--border-strong);
  }
  table.ledger th:first-child,table.ledger td:first-child{text-align:left;color:var(--text-dim);}
  table.ledger td input{
    width:56px;text-align:right;padding:4px 6px;font-size:12px;background:transparent;border:1px solid transparent;
  }
  table.ledger td input:hover{border-color:var(--border);}
  table.ledger tr.total-row td{color:var(--accent-strong);font-weight:600;border-top:1px solid var(--border-strong);border-bottom:none;}

  .balance-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
  .balance-tile{flex:1 1 140px;}
  .balance-tile .rk{font-family:var(--mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);}
  .balance-tile .rv{font-family:var(--mono);font-size:22px;color:var(--text);margin-top:4px;}
  .stackbar{height:10px;display:flex;overflow:hidden;border:1px solid var(--border);margin-bottom:16px;}
  .stackbar .seg-h{background:linear-gradient(90deg,var(--accent),var(--accent-strong));}
  .stackbar .seg-i{background:linear-gradient(90deg,var(--gold-dim),var(--gold));}
  .stackbar-legend{display:flex;gap:16px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-bottom:18px;}
  .stackbar-legend span{display:inline-flex;align-items:center;gap:5px;}
  .stackbar-legend i{width:8px;height:8px;display:inline-block;}
  .stackbar-legend .i1{background:var(--accent);}
  .stackbar-legend .i2{background:var(--gold);}

  /* trip panel spans full width */
  .panel.wide{margin-bottom:20px;}
  .trip-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:0;}
  @media (max-width:860px){.trip-grid{grid-template-columns:1fr;}}
  .trip-col{padding:18px;min-width:0;}
  .trip-col + .trip-col{border-left:1px solid var(--border);}
  @media (max-width:860px){.trip-col + .trip-col{border-left:none;border-top:1px solid var(--border);}}
  .trip-col h3{
    font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 12px;
  }

  .add-form{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .add-form input{flex:1 1 160px;}
  .add-form-2{display:flex;flex-direction:column;gap:8px;margin-top:14px;}

  .discussion{display:flex;flex-direction:column;gap:0;max-height:340px;overflow-y:auto;margin-bottom:12px;padding-right:4px;}
  .msg{padding:9px 0;border-bottom:1px solid var(--border);}
  .msg:last-child{border-bottom:none;}
  .msg-head{display:flex;gap:8px;align-items:baseline;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);}
  .msg-head b{color:var(--accent);font-size:11px;}
  .msg-text{font-size:13px;color:var(--text);margin-top:3px;word-wrap:break-word;}
  .discussion-input{display:flex;gap:8px;}
  .discussion-input input{flex:1;}

  .avatars{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap;}
  .avatar{
    width:19px;height:19px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:9px;font-weight:700;color:#04120b;
    border:1px solid rgba(0,0,0,0.25);
  }

  /* footer */
  .roster{
    display:flex;flex-wrap:wrap;gap:10px;
    padding:22px 0 10px;
    border-top:1px solid var(--border);
    margin-top:8px;
  }
  .roster-chip{
    display:inline-flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:11.5px;color:var(--text-dim);
    padding:6px 10px;border:1px solid var(--border);background:var(--surface);
  }
  .roster-chip .swatch{width:8px;height:8px;border-radius:50%;}
  .foot-note{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-top:14px;line-height:1.7;}

  .save-flash{
    position:fixed;bottom:18px;right:18px;
    font-family:var(--mono);font-size:11.5px;
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--accent-strong);
    padding:8px 14px;
    opacity:0;transform:translateY(6px);
    transition:opacity .2s, transform .2s;
    pointer-events:none;
    z-index:50;
  }
  .save-flash.show{opacity:1;transform:translateY(0);}

  .offline-banner{
    font-family:var(--mono);font-size:11.5px;color:var(--alert);
    background:var(--alert-wash);border:1px solid rgba(255,107,74,0.4);
    padding:9px 14px;margin-bottom:20px;
    display:none;
  }
  .offline-banner.show{display:block;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--surface);}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);}
</style>
